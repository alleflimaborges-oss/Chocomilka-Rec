<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2b1810">
    <title>Catálogo | Chocomilka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/catalogo.js" defer></script>
</head>
<body class="pagina-catalogo">
    <a class="pular" href="#vitrine">Ir para os produtos</a>

    <header class="topo">
        <div class="topo-conteudo">
            <span class="marca">Chocomilka</span>
            <nav class="menu" aria-label="Principal">
                <a href="/">Estoque</a>
                <a href="/catalogo" aria-current="page">Catálogo</a>
                <a href="/historico">Histórico</a>
                <a href="/fornecedores">Fornecedores</a>
                <a href="/funcionarios">Funcionários</a>
                <a href="/sobre">Sobre o site</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="resumo">
            <h1>Vitrine de chocolates</h1>
            <p id="subtituloVitrine">Carregando os produtos…</p>
        </section>

        <section class="painel barra-vitrine" aria-label="Filtros da vitrine">
            <div class="busca-campo">
                <label for="busca" class="so-leitor">Pesquisar produto</label>
                <input type="search" id="busca" placeholder="Pesquisar produto ou fornecedor" autocomplete="off">
            </div>
            <div class="barra-direita">
                <label for="categoria" class="so-leitor">Categoria</label>
                <select id="categoria"><option value="">Todas as categorias</option></select>
                <label class="opcao"><input type="checkbox" id="soDisponiveis"> Só disponíveis</label>
            </div>
        </section>

        <section id="vitrine" class="vitrine" aria-label="Produtos"></section>
        <p id="contador" class="contador-vitrine" aria-live="polite"></p>
    </main>


    <!-- Foto ampliada -->
    <dialog id="dialogoFoto" aria-labelledby="tituloFoto">
        <div class="dialogo-topo foto-topo">
            <h2 id="tituloFoto">Produto</h2>
            <button type="button" class="icone" id="fecharFoto" aria-label="Fechar">✕</button>
        </div>
        <div class="foto-grande" id="conteudoFoto"></div>
        <p class="foto-legenda" id="legendaFoto"></p>
    </dialog>

    <input type="file" id="arquivoFoto" accept="image/jpeg,image/png,image/webp" hidden>
    <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
</body>
</html>
