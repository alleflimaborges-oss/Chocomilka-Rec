<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2b1810">
    <title>Fornecedores | Chocomilka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/fornecedores.js" defer></script>
</head>
<body class="pagina-estoque pagina-cadastro">
    <a class="pular" href="#lista">Ir para a lista de fornecedores</a>

    <header class="topo">
        <div class="topo-conteudo">
            <span class="marca">Chocomilka</span>
            <nav class="menu" aria-label="Principal">
                <a href="/">Estoque</a>
                <a href="/catalogo">Catálogo</a>
                <a href="/historico">Histórico</a>
                <a href="/fornecedores" aria-current="page">Fornecedores</a>
                <a href="/funcionarios">Funcionários</a>
                <a href="/sobre">Sobre o site</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="resumo">
            <h1 id="tituloPagina">Fornecedores</h1>
            <p id="subtituloPagina">Carregando os fornecedores…</p>
        </section>

        <section class="painel" id="lista" aria-label="Fornecedores cadastrados">
            <div class="barra">
                <div class="busca-campo">
                    <label for="busca" class="so-leitor">Pesquisar fornecedor</label>
                    <input type="search" id="busca" placeholder="Pesquisar por nome, telefone ou e-mail" autocomplete="off">
                </div>
                <div class="barra-direita">
                    <button type="button" id="botaoNovo" class="primario">+ Novo fornecedor</button>
                </div>
            </div>

            <div class="tabela-responsiva">
                <table class="tabela-cadastro">
                    <thead>
                        <tr>
                            <th scope="col">Fornecedor</th>
                            <th scope="col">Telefone</th>
                            <th scope="col">E-mail</th>
                            <th scope="col">Produtos</th>
                            <th scope="col"><span class="so-leitor">Ações</span></th>
                        </tr>
                    </thead>
                    <tbody id="listaItens"></tbody>
                </table>
            </div>
            <p id="contador" class="contador" aria-live="polite"></p>
        </section>
    </main>


    <dialog id="dialogoCadastro" aria-labelledby="tituloDialogo">
        <form id="formCadastro" novalidate>
            <div class="dialogo-topo">
                <h2 id="tituloDialogo">Novo fornecedor</h2>
                <button type="button" class="icone" id="fecharDialogo" aria-label="Fechar">✕</button>
            </div>
            <input type="hidden" id="itemId">
            <div id="erroGeral" class="alerta" role="alert" hidden></div>

            <div class="grade-form">
                <div class="campo campo-largo">
                    <label for="nome">Nome do fornecedor</label>
                    <input type="text" id="nome" maxlength="80" placeholder="Ex.: Cacau Brasil" autocomplete="off" aria-describedby="erro-nome">
                    <span class="erro-campo" id="erro-nome"></span>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone <span class="opcional">(opcional)</span></label>
                    <input type="tel" id="telefone" maxlength="30" placeholder="(19) 99999-9999" autocomplete="off" aria-describedby="erro-telefone">
                    <span class="erro-campo" id="erro-telefone"></span>
                </div>
                <div class="campo">
                    <label for="email">E-mail <span class="opcional">(opcional)</span></label>
                    <input type="email" id="email" maxlength="120" placeholder="contato@empresa.com" autocomplete="off" aria-describedby="erro-email">
                    <span class="erro-campo" id="erro-email"></span>
                </div>
            </div>

            <div class="acoes-form">
                <button type="button" class="secundario" id="botaoCancelar">Cancelar</button>
                <button type="submit" class="primario" id="botaoSalvar">Cadastrar fornecedor</button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogoExcluir" aria-labelledby="tituloExcluir" aria-describedby="textoExcluir">
        <div class="dialogo-corpo">
            <h2 id="tituloExcluir">Excluir fornecedor?</h2>
            <p id="textoExcluir"></p>
            <div class="acoes-form">
                <button type="button" class="secundario" id="cancelarExclusao">Cancelar</button>
                <button type="button" class="perigo" id="confirmarExclusao">Excluir fornecedor</button>
            </div>
        </div>
    </dialog>

    <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
</body>
</html>
